# Local Postgres with the pgvector extension: checkpoints and the jobs table.
# Credentials come from .env (Compose reads it automatically); see .env.example.
#
# Start:  docker compose up -d
# Stop:   docker compose down        (add -v to also delete the data)

services:
  postgres:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:5432:5432"  # localhost only, not the rest of the network
    volumes:
      # PG18 images keep their data under /var/lib/postgresql/18/, so mount the parent.
      - pgdata:/var/lib/postgresql

volumes:
  pgdata:
