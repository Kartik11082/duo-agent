[project]
name = "duo"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.1",
    "langchain>=1.5.0",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.22",
    "langgraph-checkpoint-postgres>=3.2.1",
    "psycopg[binary,pool]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pygithub>=2.10.0",
    "python-telegram-bot>=22.8",
    "uvicorn>=0.54.0",
]

[project.scripts]
duo-server = "duo.apps.server:main"
duo-worker = "duo.apps.worker:main"

[build-system]
requires = ["uv_build>=0.11.4,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes: unused imports/vars, undefined names
  "I",        # import sorting
  "B",        # bugbear: common bug patterns
  "UP",       # pyupgrade: modern syntax
  "SIM",      # simplify
  "C4",       # comprehensions
  "N",        # pep8 naming
  "ARG",      # unused arguments
  "PL",       # pylint rules, reimplemented in Ruff
  "RUF",      # ruff-specific
]
ignore = [
  "E501",     # line length is the formatter's job
  "PLR2004",  # magic-value comparisons: too noisy
  "PLR0913",  # too many arguments: noisy for handlers
]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"  # start lenient; tighten later

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"  # list skipped tests with their reasons at the end

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
